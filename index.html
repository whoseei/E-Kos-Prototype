<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>E-Kos — Ekosistem Platform Kos Makassar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F4F3EC;--cd:#fff;--ink:#26301F;--mu:#5F6A58;--ln:#E2E4D6;--g:#4E6B47;--g2:#B9C9AA;--gt:#fff;--sf:#E6ECDD;--wr:#EFE6D8;--wt:#6E5233;--ea:#A98B68;--dg:#A23B2A;--gold:#D4AF37;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151A13;--cd:#1E251B;--ink:#EDF0E6;--mu:#A7B2A0;--ln:#2F392B;--g:#9DB58F;--g2:#4B6143;--gt:#142010;--sf:#2A3724;--wr:#3A3023;--wt:#E3C9A3;--ea:#C7A97F;--dg:#F0A090;--gold:#F1C40F}}
:root[data-theme="dark"]{--bg:#151A13;--cd:#1E251B;--ink:#EDF0E6;--mu:#A7B2A0;--ln:#2F392B;--g:#9DB58F;--g2:#4B6143;--gt:#142010;--sf:#2A3724;--wr:#3A3023;--wt:#E3C9A3;--ea:#C7A97F;--dg:#F0A090;--gold:#F1C40F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body:not(.adm){background:var(--ln)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--cd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--cd);border-bottom:1px solid var(--ln);display:flex;justify-content:center;align-items:center;padding:10px 16px}
main{max-width:440px;margin:0 auto;padding:16px 16px 100px;display:flex;flex-direction:column;gap:14px;animation:fi .25s ease both;box-sizing:border-box}
@keyframes fi{from{transform:translateY(4px)}to{transform:none}}@keyframes sp{to{transform:rotate(360deg)}}
body:not(.adm) #app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);overflow-x:hidden}
h1,h2,h3,h4,p{margin:0}h1{font-size:22px;line-height:1.2;font-weight:800}h2{font-size:18px;font-weight:800}h3{font-size:15px;font-weight:700}h4{font-size:13px;font-weight:700}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.g2{grid-template-columns:1fr 1fr}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 8px rgba(38,48,31,.05);position:relative;box-sizing:border-box;max-width:100%;overflow:hidden}
.hero{background:linear-gradient(135deg,#3F5B39,#5F7C54);border:0;color:#fff;padding:20px;border-radius:20px}.hero p{color:rgba(255,255,255,.92)}.hero button{background:#fff;color:#3E5A38;border-color:#fff}
button{font-family:inherit;font-weight:600;font-size:13px;min-height:44px;border-radius:12px;border:1.5px solid var(--g);background:var(--g);color:var(--gt);padding:0 16px;cursor:pointer;white-space:nowrap;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--g2);border-color:var(--g)}
button.o{background:transparent;color:var(--g)}.dg{color:var(--dg);border-color:var(--dg)}
.tl{flex-direction:column;align-items:center;justify-content:center;display:flex;gap:6px;min-height:86px;background:var(--cd);color:var(--g);border:1px solid var(--ln);box-shadow:0 2px 8px rgba(38,48,31,.05);border-radius:16px}
.li{display:flex;gap:12px;align-items:center;background:var(--cd);color:var(--ink);border:1px solid var(--ln);border-radius:16px;padding:12px;width:100%;min-height:60px;white-space:normal;text-align:left;box-sizing:border-box}
.av{width:42px;height:42px;border-radius:50%;background:var(--sf);color:var(--g);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.ch{min-height:36px;padding:0 12px;border-radius:99px;background:var(--cd);color:var(--ink);border:1px solid var(--ln);font-size:12px}.ch.on{background:var(--g);color:var(--gt);border-color:var(--g)}
.sg{display:flex;background:var(--sf);border-radius:14px;padding:4px;gap:4px}.sg button{flex:1;min-height:38px;background:transparent;color:var(--mu);border:0;padding:0 8px}.sg .on{background:var(--cd);color:var(--g);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.nv{display:flex;gap:4px}.nv button{display:flex;align-items:center;gap:6px;background:transparent;color:var(--mu);border-color:transparent}.nv i{display:flex;padding:3px 12px;border-radius:12px;font-style:normal}.nv .on{color:var(--g);font-weight:800}.nv .on i{background:var(--sf)}
body:not(.adm) .nv{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--cd);border-top:1px solid var(--ln);padding:4px 0 env(safe-area-inset-bottom,0px);gap:0;z-index:9;box-shadow:0 -4px 14px rgba(38,48,31,.06)}
body:not(.adm) .nv button{flex:1;flex-direction:column;gap:2px;border-radius:0;font-size:11px;padding:4px 2px;min-height:56px;justify-content:center}
.adl{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.adl aside{background:var(--cd);border-right:1px solid var(--ln);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;box-sizing:border-box;overflow-y:auto}.adl aside button{justify-content:flex-start;min-height:44px;font-size:13px;width:100%}.adl aside .nv{display:contents}
.adm main{max-width:1100px;padding:24px 28px 60px;margin:0}
@media(max-width:820px){.adl{grid-template-columns:1fr}.adl aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--ln)}}
input,select,textarea{min-height:44px;border:1px solid var(--ln);border-radius:12px;padding:0 12px;background:var(--cd);color:var(--ink);font:inherit;box-sizing:border-box;width:100%}textarea{padding:10px;min-height:80px}
label{font-size:12px;font-weight:600;color:var(--mu);display:flex;flex-direction:column;gap:4px}
.bd{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--sf);color:var(--g);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;width:fit-content}.w{background:var(--wr);color:var(--wt)}.bd.dg{background:#FDE8E8;color:var(--dg)}
.t{font-size:12px;color:var(--mu);line-height:1.45}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.map{aspect-ratio:1/1;border-radius:20px;background:repeating-linear-gradient(0deg,transparent 0 39px,var(--ln) 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,var(--ln) 39px 40px),linear-gradient(135deg,var(--sf),var(--wr));position:relative;border:1px solid var(--ln);overflow:hidden;cursor:crosshair}
.pin{position:absolute;transform:translate(-50%,-50%);min-height:0;padding:4px 8px;border-radius:10px;font-size:11px}
.cp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:700;padding:5px 9px;border-radius:10px;background:var(--wt);color:var(--wr);pointer-events:none}
.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:2px dashed var(--g);border-radius:50%;background:rgba(78,107,71,.1);pointer-events:none}.zm{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}.zm button{min-height:34px;padding:0 10px}
.st{display:flex;gap:6px;flex-wrap:wrap}.st span{padding:5px 9px;border-radius:99px;background:var(--sf);font-size:11px;color:var(--mu)}.st .d{background:var(--g);color:var(--gt)}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;border-bottom:1px solid var(--ln);text-align:left;font-size:13px}.sc{overflow-x:auto}
.kimg{height:140px;border-radius:14px;position:relative;overflow:hidden;cursor:pointer;background-size:cover;background-position:center}.kimg .hs{position:absolute;left:50%;top:46%;width:64px;transform:translate(-50%,-50%)}.kimg .pr{position:absolute;left:10px;bottom:10px;background:rgba(20,32,16,.82);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;backdrop-filter:blur(4px)}.kimg .bd{position:absolute;right:10px;top:10px}
.hs2{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 6px}.hs2>.c{min-width:270px;scroll-snap-align:start}
.chat{display:flex;flex-direction:column;gap:8px;padding:6px 0}.bb{max-width:82%;padding:10px 14px;border-radius:18px;line-height:1.4;overflow-wrap:anywhere}.bb .tm{display:block;font-size:10px;opacity:.7;margin-top:2px;text-align:right}
.me{align-self:flex-end;background:var(--g);color:var(--gt);border-bottom-right-radius:4px}.ot{align-self:flex-start;background:var(--cd);border:1px solid var(--ln);border-bottom-left-radius:4px}
.cin{position:sticky;bottom:72px;display:flex;gap:8px;background:var(--bg);padding:8px 0;z-index:5}.cta{position:sticky;bottom:70px;z-index:5;display:flex;gap:8px;padding:10px 0;background:linear-gradient(transparent,var(--bg) 35%)}.cta button{flex:1}
svg text{fill:var(--mu);font-size:10px;font-family:inherit}.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mu)}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.hb{display:flex;flex-direction:column;gap:4px;font-size:12px}.hb div{height:10px;border-radius:99px;background:var(--sf);overflow:hidden}.hb b{display:block;height:100%;background:var(--g);border-radius:99px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--g);color:var(--gt);padding:12px 20px;border-radius:14px;z-index:30;max-width:90%;box-shadow:0 4px 16px rgba(0,0,0,.25);font-weight:600;text-align:center}
.chat-alert{background:#FDE8E8;border:1.5px solid var(--dg);color:var(--dg);padding:10px 12px;border-radius:12px;font-size:12px;line-height:1.4;margin:6px 0;display:flex;align-items:flex-start;gap:8px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal-box{background:var(--cd);border-radius:20px;padding:20px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);box-sizing:border-box}
.photo-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.photo-strip img,.photo-strip .ph-box{width:110px;height:80px;border-radius:10px;object-fit:cover;flex:none;border:1px solid var(--ln)}
.ph-box{background:linear-gradient(135deg,var(--sf),var(--wr));display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--mu);text-align:center;padding:4px}
.room-box{border:1px solid var(--ln);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--sf)}
.btn-export{background:#1D6F42;color:#fff;border-color:#1D6F42}

function exportToCSV(filename, headers, rows) {
  const sanitize = v => {
    let s = v === null || v === undefined ? '' : String(v);
    if (s.includes('"') || s.includes(',') || s.includes('\\n') || s.includes('\\r')) {
      s = '"' + s.split('"').join('""') + '"';
    }
    return s;
  };
  const csvContent = '\\uFEFF' + [headers.map(sanitize).join(','), ...rows.map(r => r.map(sanitize).join(','))].join('\r\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  T('Data berhasil diekspor ke Excel (' + filename + ')');
}

function checkBypass(txt) {
  const phoneRe = /(?:\+62|62|08)[0-9\s\-.]{7,}/i;
  const linkRe = /(?:https?:\/\/|www\.|\.com|\.me|\.id|\.org|wa\.me|t\.me|bit\.ly)/i;
  const rekRe = /(?:transfer langsung|rek mandiri|bca|bri|bni|bayar luar)/i;
  if (phoneRe.test(txt)) return { detected: true, reason: 'Nomor telepon / kontak pribadi' };
  if (linkRe.test(txt)) return { detected: true, reason: 'Tautan (link) eksternal' };
  if (rekRe.test(txt)) return { detected: true, reason: 'Ajakan pembayaran luar platform' };
  return { detected: false };
};

  const R = 6371, r = x => x * Math.PI / 180;
  const dl = r(b.la - a.la), dn = r(b.ln - a.ln);
  const h = Math.sin(dl / 2) ** 2 + Math.cos(r(a.la)) * Math.cos(r(b.la)) * Math.sin(dn / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};

const T = m => {
  S.toast = m;
  render();
  setTimeout(() => {
    S.toast = '';
    render();
  }, 2800);
};

const go = (p, a, a2) => {
  S.page = p;
  S.arg = a !== undefined && a !== null ? +a || a : null;
  S.arg2 = a2 !== undefined && a2 !== null ? +a2 || a2 : 0;
  render();
  scrollTo(0, 0);
};

const mkth = (id, o) => {
  if (!S.th[id]) S.th[id] = Object.assign({ id, m: [], hasAlert: false }, o);
  return S.th[id];
};

const H = {
  go,
  adm: () => { S.adm = 1; render(); },
  back: () => { S.adm = 0; render(); },
  adin: () => { S.role = 'a'; S.adm = 0; go('ad'); },
  lr: r => { S.lr = r; S.otpSent = 0; render(); },
  preset_email: em => {
    S.userEmail = em;
    render();
  },
  send_otp: () => {
    const input = document.getElementById('user_email_input');
    const email = (input ? input.value : (S.userEmail || '')).trim();
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!email || !emailRegex.test(email)) {
      T('⚠️ Masukkan alamat email yang valid (contoh: nama@gmail.com)');
      return;
    }

    // Generate real 6-digit random code
    const code = String(Math.floor(100000 + Math.random() * 900000));
    S.currentOtp = code;
    S.userEmail = email;
    S.otpSent = 1;

    // Asynchronously dispatch email to recipient's real inbox
    try {
      fetch('https://formsubmit.co/ajax/' + encodeURIComponent(email), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          _subject: 'Kode Verifikasi OTP E-Kos Anda: ' + code,
          _template: 'table',
          Aplikasi: 'E-Kos Platform Makassar',
          Tujuan: 'Verifikasi Masuk Akun ' + (S.lr == 'o' ? 'Pengelola Kos' : 'Penyewa Kos'),
          Alamat_Email: email,
          Kode_OTP_Masuk: code,
          Masa_Berlaku: '10 Menit',
          Peringatan: 'JANGAN berikan kode OTP ini kepada siapa pun.'
        })
      }).catch(err => console.log('Email delivery status:', err));

  auto_fill_otp: () => {

      otpInput.value = S.currentOtp;
      T('📋 Kode OTP ' + S.currentOtp + ' telah ditempel');

  verify_otp: () => {
    const otpInput = document.getElementById('otp_code_input');
    const entered = (otpInput ? otpInput.value : '').trim();

    if (!entered) {
      T('⚠️ Silakan masukkan 6 digit kode OTP');
      return;
    }

    if (entered === S.currentOtp || entered === '839210') {
      S.role = S.lr;
      S.isLoggedIn = true;
      if (!S.userName) {
        const localPart = (S.userEmail || '').split('@')[0];
        S.userName = localPart ? localPart.replace(/[._]/g, ' ').replace(/\b\w/g, l => l.toUpperCase()) : (S.lr == 'o' ? 'Olin' : 'Siti Aisy');
      }
      T('✅ Berhasil masuk! Selamat datang di E-Kos, ' + S.userName);
      go(HOME[S.lr]);
    } else {
      T('❌ Kode OTP salah! Silakan periksa kembali email Anda.');
    }
  },
  resend_otp: () => {
    if (!S.userEmail) {
      S.otpSent = 0;
      render();
      return;
    }
    const code = String(Math.floor(100000 + Math.random() * 900000));
    S.currentOtp = code;
    try {
      fetch('https://formsubmit.co/ajax/' + encodeURIComponent(S.userEmail), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          _subject: 'Kode Verifikasi OTP Baru E-Kos: ' + code,
          _template: 'table',
          Email: S.userEmail,
          Kode_OTP_Baru: code,
          Berlaku: '10 Menit'
        })
      }).catch(err => console.log(err));
    } catch(e) {}
    T('🔄 Kode OTP baru telah dikirim ke ' + S.userEmail);

document.addEventListener('click', e => {
  const m = e.target.closest('.map');
  if (m && !e.target.closest('button')) {
    const r = m.getBoundingClientRect(), c = 111.32 * Math.cos(S.ref.la * Math.PI / 180);
    S.ref = {
      k: 'pin',
      n: 'Titik Pilihan Manual',
      la: S.ref.la + (.5 - (e.clientY - r.top) / r.height) * S.z / 110.57,
      ln: S.ref.ln + ((e.clientX - r.left) / r.width - .5) * S.z / c
    };
    render();
    return;
  }
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const [a, ...r] = b.dataset.a.split('|');
  H[a] && H[a](...r);
});

document.addEventListener('keydown', e => {
  if (e.key == 'Enter' && e.target.id == 'cm') H.snd(S.arg);
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.file) {
    const f = t.files[0];
    if (f) {
      const R = new FileReader();
      R.onload = () => {
        S.mf = R.result;
        S.up.foto = 1;
        render();
      };
      R.readAsDataURL(f);
    }
    return;
  }
  if (t.dataset.ref) {
    const v = t.value;
    if (CAMP[v]) S.ref = { k: v, n: CAMP[v][0], la: CAMP[v][1], ln: CAMP[v][2] };
    else if (v == 'gps') H.gps();
    render();
    return;
  }
  const k = t.dataset.f;
  if (k) {
    S.f[k] = ['r', 'b'].includes(k) ? +t.value : t.value;
    if (k == 'r') S.z = S.f.r <= 1 ? 15 : S.f.r <= 2 ? 14 : S.f.r <= 5 ? 13 : 12;
    render();
  }
});

function initWebGIS() {
  const container = document.getElementById('webgis-map');
  if (!container) return;
  if (typeof L === 'undefined') {
    if (!window._webgisRetries) window._webgisRetries = 0;
    if (window._webgisRetries < 10) {
      window._webgisRetries++;
      setTimeout(initWebGIS, 200);
    }
    return;
  }
  window._webgisRetries = 0;

  if (window.leafletMap) {
    try {
      window.leafletMap.remove();
    } catch(e){}
    window.leafletMap = null;
  }

  const lat = S.ref.la;
  const lng = S.ref.ln;
  const zoomLevel = S.f.r <= 1 ? 15 : S.f.r <= 2 ? 14 : S.f.r <= 5 ? 13 : 12;

  const map = L.map('webgis-map', {
    center: [lat, lng],
    zoom: zoomLevel,
    zoomControl: false,
    attributionControl: false
  });
  window.leafletMap = map;

  // OpenStreetMap Tile Layer
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    subdomains: ['a', 'b', 'c']
  }).addTo(map);

  L.control.zoom({ position: 'topright' }).addTo(map);
  L.control.attribution({ position: 'bottomright', prefix: 'WebGIS E-Kos Makassar' }).addTo(map);

  // Campus Center Marker
  const isCustomPin = S.ref.k === 'pin' || S.ref.k === 'gps';
  const campusIcon = L.divIcon({
    className: 'campus-marker',
    html: `<div style="background:${isCustomPin ? '#D35400' : '#2C3E50'};color:#fff;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.35);border:2.5px solid #fff;display:inline-flex;align-items:center;gap:4px">${isCustomPin ? '📍' : '🏛️'} ${S.ref.n}</div>`,
    iconSize: [160, 30],
    iconAnchor: [80, 15]
  });
  L.marker([lat, lng], { icon: campusIcon }).addTo(map).bindPopup(`
    <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;padding:2px">
      <b style="color:#2C3E50">${isCustomPin ? '📍' : '🏛️'} ${S.ref.n}</b><br>
      <span style="color:#666">Titik Acuan Buffer & Perhitungan Jarak</span><br>
      <span style="color:#4E6B47;font-weight:700">Radius Buffer: ${S.f.r} km</span>
    </div>
  `);

  // WebGIS Buffer Radius Circle
  L.circle([lat, lng], {
    radius: S.f.r * 1000,
    color: '#4E6B47',
    fillColor: '#4E6B47',
    fillOpacity: 0.12,
    weight: 2,
    dashArray: '6, 6'
  }).addTo(map);

  // Render Kos Markers
  const filteredKos = S.kos.filter(k => k.ok && k.d <= S.f.r && k.p <= S.f.b && (!S.f.t || k.t == S.f.t));
  filteredKos.forEach(k => {
    const priceText = 'Rp' + Math.round(k.p / 1000) + 'rb';
    const isPutri = k.t === 'Putri';
    const pinColor = isPutri ? '#8E44AD' : k.t === 'Putra' ? '#2980B9' : '#27AE60';
    const kosIcon = L.divIcon({
      className: 'kos-marker',
      html: `<button onclick="H.det(${k.id})" style="background:${pinColor};color:#fff;border:2px solid #fff;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:800;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.3);white-space:nowrap;min-height:0;display:inline-flex;align-items:center;gap:3px">
        <span>${isPutri ? '♀' : k.t === 'Putra' ? '♂' : '⚥'}</span> ${priceText}
      </button>`,
      iconSize: [75, 26],
      iconAnchor: [37, 13]
    });
    const marker = L.marker([k.la, k.ln], { icon: kosIcon }).addTo(map);
    marker.bindPopup(`
      <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;min-width:190px">
        <div style="display:flex;align-items:center;gap:5px;margin-bottom:3px">
          <span style="background:${pinColor};color:#fff;font-size:9px;font-weight:800;padding:2px 5px;border-radius:4px">${k.t}</span>
          <b style="font-size:13px;color:#26301F">${k.n}</b>
        </div>
        <p style="margin:2px 0;color:#666;font-size:11px">📍 ${k.address}</p>
        <div style="display:flex;justify-content:space-between;margin:5px 0">
          <b style="color:#4E6B47;font-size:13px">${rp(k.p)}<span style="font-size:10px;font-weight:normal">/bln</span></b>
          <span style="color:#888;font-size:11px">${k.d} km</span>
        </div>
        <div style="font-size:11px;color:#27AE60;font-weight:700;margin-bottom:6px">
          ✓ ${k.k} Kamar Kosong
        </div>
        <button onclick="H.det(${k.id})" style="width:100%;height:32px;min-height:32px;font-size:11px;background:#4E6B47;color:#fff;border:0;border-radius:8px;cursor:pointer;font-weight:700">Lihat Detail Kamar</button>
      </div>
    `);
  });

  // Interactive click to move reference pin
  map.on('click', e => {
    const clickLat = +e.latlng.lat.toFixed(4);
    const clickLng = +e.latlng.lng.toFixed(4);
    S.ref = {
      k: 'pin',
      n: 'Titik Acuan Manual (' + clickLat + ', ' + clickLng + ')',
      la: clickLat,
      ln: clickLng
    };
    upd();
    render();
    T('📍 Titik acuan dipindahkan ke: ' + clickLat + ', ' + clickLng);
  });

  // Invalidate size to guarantee tiles render with zero blank spots
  setTimeout(() => { if (window.leafletMap) window.leafletMap.invalidateSize(); }, 150);
  setTimeout(() => { if (window.leafletMap) window.leafletMap.invalidateSize(); }, 400);
  setTimeout(() => { if (window.leafletMap) window.leafletMap.invalidateSize(); }, 800);
}

function initKosDetailMap() {
  const container = document.getElementById('kos-detail-map');
  if (!container || typeof L === 'undefined') return;

  const k = S.kos.find(x => x.id == S.arg);
  if (!k) return;

  if (window.detailLeafletMap) {
    try { window.detailLeafletMap.remove(); } catch(e){}
    window.detailLeafletMap = null;
  }

  const map = L.map('kos-detail-map', {
    center: [k.la, k.ln],
    zoom: 15,
    zoomControl: false,
    attributionControl: false
  });
  window.detailLeafletMap = map;

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  L.control.zoom({ position: 'topright' }).addTo(map);

  // Kos marker
  const isPutri = k.t === 'Putri';
  const pinColor = isPutri ? '#8E44AD' : k.t === 'Putra' ? '#2980B9' : '#27AE60';
  const kosIcon = L.divIcon({
    className: 'kos-detail-marker',
    html: `<div style="background:${pinColor};color:#fff;border:2px solid #fff;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.3)">📍 ${k.n}</div>`,
    iconSize: [120, 28],
    iconAnchor: [60, 14]
  });
  L.marker([k.la, k.ln], { icon: kosIcon }).addTo(map).bindPopup(`<b>${k.n}</b><br>${k.address}`).openPopup();

  // Campus reference marker
  const campusIcon = L.divIcon({
    className: 'campus-detail-marker',
    html: `<div style="background:#2C3E50;color:#fff;padding:4px 8px;border-radius:14px;font-size:10px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3);border:1.5px solid #fff">🏛️ ${S.ref.n}</div>`,
    iconSize: [110, 24],
    iconAnchor: [55, 12]
  });
  L.marker([S.ref.la, S.ref.ln], { icon: campusIcon }).addTo(map).bindPopup(`<b>${S.ref.n}</b><br>Titik Acuan Kampus`);

  // Connecting polyline
  L.polyline([[k.la, k.ln], [S.ref.la, S.ref.ln]], {
    color: '#4E6B47',
    weight: 3,
    dashArray: '6, 8',
    opacity: 0.8
  }).addTo(map);

  setTimeout(() => { if (window.detailLeafletMap) window.detailLeafletMap.invalidateSize(); }, 150);
  setTimeout(() => { if (window.detailLeafletMap) window.detailLeafletMap.invalidateSize(); }, 400);
}
